name: Patch fact management and grid keywords
on:
  push:
    paths:
      - 'scripts/patch-fact-management-keywords.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked targeted patch
        run: python3 scripts/patch-fact-management-keywords.py
      - name: Commit patch
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Fix fact management navigation and editable grid keywords"
            git push
          fi
