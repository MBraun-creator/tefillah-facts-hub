name: Add class mastery percentages CSV
on:
  push:
    paths:
      - 'scripts/patch-class-mastery-percent-csv.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-class-mastery-percent-csv.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Add class mastery percentage CSV export" && git push)
