name: Fix unlocked facts CSV denominator
on:
  push:
    paths:
      - scripts/fix-unlocked-mastery-csv.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-unlocked-mastery-csv.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Calculate mastery CSV using unlocked facts only" && git push)
