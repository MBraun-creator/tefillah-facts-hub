name: Install default facts loader
on:
  push:
    paths:
      - 'scripts/install-default-facts.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch HTML safely
        run: python3 scripts/install-default-facts.py
      - name: Commit only if changed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Load 100 default facts for new teachers"
            git push
          fi
