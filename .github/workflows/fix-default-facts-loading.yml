name: Fix empty fact library initialization
on:
  push:
    paths:
      - 'scripts/fix-default-facts-loading.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-default-facts-loading.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Restore default facts loading for existing empty libraries" && git push)
