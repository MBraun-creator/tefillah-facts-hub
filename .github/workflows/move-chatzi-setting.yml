name: Move Chatzi Zuz setting to bottom
on:
  push:
    paths:
      - 'scripts/move-chatzi-setting.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/move-chatzi-setting.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Move Chatzi Zuz toggle to bottom of settings" && git push)
